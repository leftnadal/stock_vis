components:
  schemas:
    ActionTypeEnum:
      enum:
      - watch
      - expand
      - alternatives
      - recheck
      - archive
      - resolve
      type: string
      description: |-
        * `watch` - Watch
        * `expand` - Expand
        * `alternatives` - Alternatives
        * `recheck` - Recheck
        * `archive` - Archive
        * `resolve` - Resolve
    AlertEvent:
      type: object
      description: 전이 알림 — 인앱 패널 행(상태색/라벨 파생 포함).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        monitor:
          type: string
          format: uuid
          readOnly: true
        monitor_name:
          type: string
          readOnly: true
        target_ref:
          type: string
          readOnly: true
        from_state:
          allOf:
          - $ref: '#/components/schemas/CurrentStateEnum'
          readOnly: true
        to_state:
          allOf:
          - $ref: '#/components/schemas/CurrentStateEnum'
          readOnly: true
        from_label:
          type: string
          readOnly: true
        to_label:
          type: string
          readOnly: true
        asof:
          type: string
          format: date
          readOnly: true
        score:
          type: number
          format: double
          readOnly: true
        is_deterioration:
          type: boolean
          readOnly: true
        is_suppressed:
          type: boolean
          readOnly: true
        read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - asof
      - created_at
      - from_label
      - from_state
      - id
      - is_deterioration
      - is_suppressed
      - monitor
      - monitor_name
      - read
      - score
      - target_ref
      - to_label
      - to_state
    AnomalyItem:
      type: object
      properties:
        rule_id:
          type: string
        headline:
          type: string
        threshold:
          type: object
          additionalProperties: {}
        actual:
          type: number
          format: double
        paired_news_id:
          type: integer
          nullable: true
      required:
      - actual
      - headline
      - paired_news_id
      - rule_id
      - threshold
    AnomalySection:
      type: object
      properties:
        mode:
          type: string
        overview:
          type: string
        sector_highlight:
          type: string
        portfolio_action:
          type: string
        fired:
          type: array
          items:
            $ref: '#/components/schemas/AnomalyItem'
      required:
      - fired
      - mode
      - overview
      - portfolio_action
      - sector_highlight
    AssetSummary:
      description: GET 자산 요약 — 최근 PortfolioSnapshot + 진행/배치 갭 + 모드.
      properties:
        available:
          title: Available
          type: boolean
        date:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Date
        total_krw:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Total Krw
        by_currency:
          additionalProperties: true
          default: {}
          title: By Currency
          type: object
        price_as_of:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Price As Of
        progress_gap:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Progress Gap
        allocation_gap:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Allocation Gap
        mode:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Mode
      required:
      - available
      title: AssetSummaryContract
      type: object
    BlankEnum:
      enum:
      - ''
    BreadthCard:
      type: object
      properties:
        universe:
          type: string
        advance:
          type: integer
        decline:
          type: integer
        unchanged:
          type: integer
        total:
          type: integer
        new_high_52w:
          type: integer
        new_low_52w:
          type: integer
        ad_line:
          type: integer
        ad_line_change:
          type: integer
      required:
      - ad_line
      - ad_line_change
      - advance
      - decline
      - new_high_52w
      - new_low_52w
      - total
      - unchanged
      - universe
    BriefCard:
      type: object
      properties:
        headline:
          type: string
        content_preview:
          type: string
        status:
          type: string
        model_version:
          type: string
      required:
      - content_preview
      - headline
      - model_version
      - status
    Cards:
      type: object
      properties:
        regime:
          allOf:
          - $ref: '#/components/schemas/RegimeCard'
          nullable: true
        breadth:
          allOf:
          - $ref: '#/components/schemas/BreadthCard'
          nullable: true
        sector:
          allOf:
          - $ref: '#/components/schemas/SectorCard'
          nullable: true
        concentration:
          allOf:
          - $ref: '#/components/schemas/ConcentrationCard'
          nullable: true
        brief:
          allOf:
          - $ref: '#/components/schemas/BriefCard'
          nullable: true
      required:
      - breadth
      - brief
      - concentration
      - regime
      - sector
    CashUpsertRequest:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
      required:
      - amount
      - currency
    Claim:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        monitor:
          type: string
          format: uuid
        assertion:
          type: string
          description: 주장
        deadline:
          type: string
          format: date
          nullable: true
          description: 마감
        status:
          $ref: '#/components/schemas/ClaimStatusEnum'
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        proposed_verdict:
          readOnly: true
          nullable: true
          description: |-
            시스템 제안 판정 (마감 전 없음)

            * `validated` - Validated
            * `partial` - Partial
            * `invalidated` - Invalidated
            * `expired` - 기한만료
          oneOf:
          - $ref: '#/components/schemas/ProposedVerdictEnum'
          - $ref: '#/components/schemas/NullEnum'
        resolved_by:
          type: integer
          readOnly: true
          nullable: true
          description: 마감 주체
        factor_tags:
          type: array
          items:
            $ref: '#/components/schemas/FactorTagsEnum'
          readOnly: true
          description: 회고 요인 태그(고정 enum)
        retro_memo:
          type: string
          readOnly: true
          description: 회고 선택 한 줄
        scenario_type:
          allOf:
          - $ref: '#/components/schemas/ScenarioTypeEnum'
          description: |-
            시나리오 모드(신규 매수/보유 관리/추가 매수)

            * `new_entry` - 신규 매수
            * `hold` - 보유 관리
            * `add_on` - 추가 매수
        entry_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,4})?$
          nullable: true
          description: 진입가
        target_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,4})?$
          nullable: true
          description: 목표가(익절)
        stop_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,4})?$
          nullable: true
          description: 손절가
        purchase_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,4})?$
          nullable: true
          description: 매입가(확정 사실)
        purchase_date:
          type: string
          format: date
          nullable: true
          description: 매입일(보유 기간 원천)
        fair_value_low:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,4})?$
          nullable: true
          description: 적정가 하단
        fair_value_high:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,4})?$
          nullable: true
          description: 적정가 상단
        last_price_zone:
          readOnly: true
          nullable: true
          description: |-
            직전 가격 구간(전이 감지용)

            * `exited` - 이탈
            * `entry` - 진입 구간
            * `approach` - 접근
            * `waiting` - 관망
            * `overheated` - 과열
          oneOf:
          - $ref: '#/components/schemas/LastPriceZoneEnum'
          - $ref: '#/components/schemas/NullEnum'
        entry_reached_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: 진입 구간 최초 도달 시각(1회 기록)
        zone_display:
          type: string
          readOnly: true
        closure_snapshot:
          type: string
          readOnly: true
        evidences:
          type: array
          items:
            $ref: '#/components/schemas/ClaimEvidence'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - assertion
      - closure_snapshot
      - created_at
      - entry_reached_at
      - evidences
      - factor_tags
      - id
      - last_price_zone
      - monitor
      - proposed_verdict
      - resolved_at
      - resolved_by
      - retro_memo
      - zone_display
    ClaimEvidence:
      type: object
      description: |-
        Claim 근거(자동형/수동형, RECON-SWAP-0813 PART 1). 쓰기는 별도 엔드포인트
        (/api/v1/monitor/claim-evidences/)에서 — ClaimSerializer.evidences는 read-only nested.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        claim:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ClaimEvidenceKindEnum'
        indicator:
          type: string
          format: uuid
          nullable: true
