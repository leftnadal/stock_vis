                - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
                  type: string
                - type: 'null'
                default: null
                description: 12분기 전 값 (3년치 데이터, FMP 미가용 시 None).
                title: Window 12Q
            required:
            - current
            title: TimeSeriesContext
            type: object
          - type: 'null'
          default: null
          description: 'Slice 8 #27 시계열 컨텍스트 (선택).'
