openapi: 3.0.3
info:
  title: Stock-Vis Market Pulse v2 API
  version: '2.0'
  description: Market Pulse v2 Phase 1 — 시장 레짐 + 시장 폭 + 섹터 흐름 + 집중도 + LLM 브리핑 + 이상
    신호. JWT Bearer 인증. 응답 본체는 영문 키 (한글은 /i18n endpoint).
paths:
  /api/credit-signals/strip/:
    get:
      operationId: api_credit_signals_strip_retrieve
      description: 크레딧 신호 스트립 (as_of + raw 6 + 파생 2 signal + spark).
      summary: 크레딧 신호 스트립 (Dashboard)
      tags:
      - Credit Signals
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/dashboard/news-strip/:
    get:
      operationId: api_dashboard_news_strip_retrieve
      description: |-
        GET /api/dashboard/news-strip — 홈 상단 뉴스 축 응축 스트립.

        인증 필수(user 스코프 = 보유·관심 티어). 읽기 전용. 응답 실패·빈 데이터도 200
        (빈 items 배열) — FE 실패 격리와 짝.
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/providers/cache/:
    get:
      operationId: admin_providers_cache_retrieve
      description: 캐시 통계 조회
      summary: Provider 캐시 관리
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 캐시 통계 / 무효화 결과
    delete:
      operationId: admin_providers_cache_destroy
      description: 캐시 무효화
      summary: Provider 캐시 관리
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 캐시 통계 / 무효화 결과
  /api/v1/admin/providers/config/:
    get:
      operationId: admin_providers_config_retrieve
      description: 현재 Provider 설정 조회
      summary: Provider 설정 조회
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: feature_flags/cache_ttl/rate_limits/fallback_enabled
  /api/v1/admin/providers/rate-limits/:
    get:
      operationId: admin_providers_rate_limits_retrieve
      description: 모든 Provider의 Rate Limit 상태
      summary: Rate Limit 상태 조회 / 리셋
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Rate Limit 카운터
    post:
      operationId: admin_providers_rate_limits_create
      description: Rate Limit 카운터 리셋
      summary: Rate Limit 상태 조회 / 리셋
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Rate Limit 카운터
  /api/v1/admin/providers/status/:
    get:
      operationId: admin_providers_status_retrieve
      description: 모든 Provider의 현재 상태 조회
      summary: Provider 상태 조회
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: providers/feature_flags/fallback_enabled
  /api/v1/admin/providers/test/:
    post:
      operationId: admin_providers_test_create
      description: 특정 Provider 연결 테스트
      summary: Provider 연결 테스트
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Provider quote 테스트 결과
  /api/v1/advisory/knobs/:
    get:
      operationId: advisory_knobs_retrieve
      description: |-
        손잡이 5종 + 목표 수익률.

        GET   현재값(읽기).
        POST  목표 생성(SLICE20BF2) — target·horizon 필수, risk·손잡이 선택. 이미 존재 시 409.
              생성 단일 경로(D-f2-1), PATCH는 수정 전용(upsert 아님).
        PATCH 부분 수정(SLICE20B) — 목표 수익률 + 손잡이 5종. **서버측 검증기 강제**:
              UserGoal.full_clean()이 필드 validators + KNOB_RANGES(clean)를 실행,
              범위 밖은 400(프론트 검증만으로 대체 금지). 저장은 사용자 명시 요청만 —
              엔진/시스템 자동 조정 경로 아님. **저장 ≠ 진단 실행**(D2, [지금 진단] 별도).
      tags:
      - portfolio-advisory
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnobsRead'
          description: ''
    post:
      operationId: advisory_knobs_create
      description: |-
        손잡이 5종 + 목표 수익률.

        GET   현재값(읽기).
        POST  목표 생성(SLICE20BF2) — target·horizon 필수, risk·손잡이 선택. 이미 존재 시 409.
              생성 단일 경로(D-f2-1), PATCH는 수정 전용(upsert 아님).
        PATCH 부분 수정(SLICE20B) — 목표 수익률 + 손잡이 5종. **서버측 검증기 강제**:
              UserGoal.full_clean()이 필드 validators + KNOB_RANGES(clean)를 실행,
              범위 밖은 400(프론트 검증만으로 대체 금지). 저장은 사용자 명시 요청만 —
              엔진/시스템 자동 조정 경로 아님. **저장 ≠ 진단 실행**(D2, [지금 진단] 별도).
      tags:
      - portfolio-advisory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoalCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoalCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnobsRead'
          description: ''
    patch:
      operationId: advisory_knobs_partial_update
      description: |-
        손잡이 5종 + 목표 수익률.

        GET   현재값(읽기).
        POST  목표 생성(SLICE20BF2) — target·horizon 필수, risk·손잡이 선택. 이미 존재 시 409.
              생성 단일 경로(D-f2-1), PATCH는 수정 전용(upsert 아님).
        PATCH 부분 수정(SLICE20B) — 목표 수익률 + 손잡이 5종. **서버측 검증기 강제**:
              UserGoal.full_clean()이 필드 validators + KNOB_RANGES(clean)를 실행,
              범위 밖은 400(프론트 검증만으로 대체 금지). 저장은 사용자 명시 요청만 —
              엔진/시스템 자동 조정 경로 아님. **저장 ≠ 진단 실행**(D2, [지금 진단] 별도).
      tags:
      - portfolio-advisory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedKnobsUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedKnobsUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedKnobsUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnobsRead'
          description: ''
  /api/v1/advisory/latest/:
    get:
      operationId: advisory_latest_retrieve
      description: 최신 권유(최근 AdvisoryRun). 없으면 available=False.
