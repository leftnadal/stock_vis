      operationId: advisory_run_create
      description: 수동 진단 실행(trigger=manual 기록) 후 최신 권유 봉투 반환.
      tags:
      - portfolio-advisory
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestAdvisory'
          description: ''
  /api/v1/advisory/summary/:
    get:
      operationId: advisory_summary_retrieve
      description: 자산 요약(최근 스냅샷) + 진행/배치 갭 + 모드. 스냅샷 없으면 available=False.
      tags:
      - portfolio-advisory
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSummary'
          description: ''
  /api/v1/chainsight/{symbol}/graph/:
    get:
      operationId: chainsight_graph_retrieve
      description: 'CS-4-1: N-depth 그래프 탐색.'
      parameters:
      - in: path
        name: symbol
        schema:
          type: string
        required: true
      tags:
      - Chain Sight
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/chainsight/{symbol}/neighbors/:
    get:
      operationId: chainsight_neighbors_retrieve
      description: 마켓 뷰 탐색 핵심 API. 중심 이동 + 관계 카드 패널 렌더 데이터.
      parameters:
      - in: path
        name: symbol
        schema:
          type: string
        required: true
      tags:
      - Chain Sight
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/chainsight/{symbol}/suggestions/:
    get:
      operationId: chainsight_suggestions_retrieve
      description: 'CS-4-2: 카테고리별 탐색 제안.'
      parameters:
      - in: path
        name: symbol
        schema:
          type: string
        required: true
      tags:
      - Chain Sight
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/chainsight/centrality/top/:
    get:
      operationId: chainsight_centrality_top_retrieve
      description: 일별 중심성 상위 N 조회.
      tags:
      - chainsight
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/chainsight/ego/{symbol}/:
    get:
      operationId: chainsight_ego_retrieve
      description: GET /api/v1/chainsight/ego/<symbol>/ — PG 네이티브 1-hop ego 그래프.
      parameters:
      - in: path
        name: symbol
        schema:
          type: string
        required: true
      tags:
      - chainsight
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/chainsight/events/:
    get:
      operationId: chainsight_events_retrieve
      description: |-
        GET /api/v1/chainsight/events/

        theme_tags 기반 이벤트 그룹 목록 (평균 관심도 내림차순).
        멤버 < 3 그룹 제외.
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: '조회 날짜 (YYYY-MM-DD). 기본값: 최신 스냅샷 날짜.'
      tags:
      - Chain Sight
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/chainsight/events/{theme}/stocks/:
    get:
      operationId: chainsight_events_stocks_retrieve
      description: |-
        GET /api/v1/chainsight/events/<theme>/stocks/

        테마 소속 종목 score 내림차순 랭킹.
        없는 테마: 404.
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: '조회 날짜 (YYYY-MM-DD). 기본값: 최신 스냅샷 날짜.'
      - in: path
        name: theme
        schema:
          type: string
        required: true
      - in: query
        name: window
        schema:
          type: integer
        description: '주도주 지표 윈도우(20 또는 120). 기본값: 20. 그 외 값은 20으로 폴백.'
      tags:
      - Chain Sight
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/chainsight/mindmap/card/{symbol}/:
    get:
      operationId: chainsight_mindmap_card_retrieve
      description: |-
        GET /api/v1/chainsight/mindmap/card/<symbol>/

        카드 상세: 게이트 통과 연결(상대·유형·방향·강도·계약일) + '같은 그룹'(CO_MENTIONED)
        분리 배열 + ACQUIRED 방향 구조(현재 0=빈 상태 정상). excluded 미노출.
      parameters:
      - in: path
        name: symbol
        schema:
          type: string
        required: true
      tags:
      - chainsight
      responses:
        '200':
          description: No response body
  /api/v1/chainsight/mindmap/tree/:
    get:
      operationId: chainsight_mindmap_tree_retrieve
      description: |-
        GET /api/v1/chainsight/mindmap/tree/

        업종 2단(sector→industry) 트리 + 종목 카드 요약. 755종목 전량(D1).
        sector 없음 → '미분류' 버킷. sector 케이싱 중복은 최다 표기로 정규화.
      tags:
      - chainsight
      responses:
        '200':
          description: No response body
  /api/v1/chainsight/sector/{sector}/graph/:
    get:
